<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salvapantallas</title>
<link rel="preload" href="figtree.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Figtree;src:url(figtree.woff2) format("woff2");font-weight:300 900;font-style:normal;font-display:block}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{color:#fff;font-family:Figtree,Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;cursor:none}
svg.i{width:1em;height:1em;display:block;fill:currentColor;flex:none}
.ss{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto 1fr;justify-items:center;text-align:center;white-space:nowrap}
.mid{grid-row:2;display:flex;flex-direction:column;align-items:center}
#clock{font-size:min(13.5vw,21.5vh);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.03em}
#clock .c{font-size:.7em;font-weight:300;opacity:.6;display:inline-block;vertical-align:.12em;padding:0 .02em}
/* Birthday colours fade in digit by digit: --p goes 0 -> 1 on #clock, each digit starts a bit later (--k) */
@property --p{syntax:'<number>';inherits:true;initial-value:0}
#clock{transition:--p 5s ease-in-out}
#clock .d0{--c:#ffb020;--k:0}
#clock .d1{--c:#ff6b8b;--k:1}
#clock .d2{--c:#7ad3ff;--k:2}
#clock .d3{--c:#b98cff;--k:3}
#clock .d4{--c:#7be3a1;--k:4}
#clock .d5{--c:#ffb020;--k:5}
#clock [class^="d"]{color:color-mix(in srgb,var(--c) calc(clamp(0,var(--p) * 2 - var(--k) * .2,1) * 100%),#fff)}
#clock .s{opacity:calc(.45 + .35 * var(--p))}
#date{font-size:min(2.4vw,3.8vh);font-weight:500;opacity:.85;margin-top:.5em}
.wx{display:flex;align-items:center;gap:.5em;margin-top:1.4em;font-size:min(1.7vw,2.7vh);line-height:1.6em;opacity:.85}
.wx svg.i{width:1.6em;height:1.6em;color:rgba(255,255,255,.85)}
.wx .t{font-size:1.35em;font-weight:500}
.wx .m{opacity:.7}
.cal{display:flex;justify-content:center;align-items:stretch;gap:3vw;font-size:min(1.9vw,3vh);text-align:left}
.cal .col{min-width:0;max-width:34vw}
.cal .col.hoy{max-width:44vw;font-size:1.15em}
.cal.uno .col{max-width:60vw}
.cal .sep{width:1px;flex:none;background:rgba(255,255,255,.18)}
.cal .hd{display:flex;align-items:center;gap:.45em;font-size:.8em;font-weight:600;margin-bottom:.45em;color:rgba(255,255,255,.75)}
.cal .hd svg.i{width:1.15em;height:1.15em}
.cal .ls{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:.8em;row-gap:.24em}
.cal .h{font-variant-numeric:tabular-nums;color:rgba(255,255,255,.45)}
.cal .n{overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.7)}
.cal .hoy .hd{color:#ffb020}
.cal .hoy .h{color:rgba(255,176,32,.7)}
.cal .hoy .n{color:#ffb020;font-weight:600}
.cal .mas{color:rgba(255,255,255,.5);padding-top:.15em;font-size:.9em}
#avisos{grid-row:3;align-self:end;width:min(90vw,1100px);padding-bottom:6vh;display:flex;flex-direction:column;gap:1vh}
.fx{position:absolute;inset:0;z-index:0;pointer-events:none;display:none;overflow:hidden}
.fx b{position:absolute;top:0;animation:fall linear infinite backwards}
@keyframes fall{from{transform:translateY(-16vh)}to{transform:translateY(106vh)}}
.fx i{display:block;animation:sway ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(calc(-1 * var(--x))) rotate(0deg) rotateX(0deg)}to{transform:translateX(var(--x)) rotate(var(--r)) rotateX(180deg)}}
/* Greeting: opens up below the clock (the clock glides up instead of jumping), then fades and rises into place */
.fl{display:flex;align-items:center;gap:.45em;font-size:min(3.4vw,5.4vh);font-weight:700;color:#ffb020;line-height:1.25;max-height:0;margin:0;opacity:0;transform:translateY(.6em) scale(.96);overflow:hidden;transition:max-height 1.2s ease-in-out,margin 1.2s ease-in-out,opacity 1.4s ease-out .9s,transform 1.4s cubic-bezier(.2,.8,.2,1) .9s}
.fl svg.i{width:1.1em;height:1.1em}
.mid,#avisos{position:relative;z-index:1}
.bd .fx{display:block}
.bd .fl{max-height:1.6em;margin:.35em 0 .1em;opacity:1;transform:none}
/* Already a birthday when the screensaver opens: show everything at once, no entrance */
.instant #clock,.instant .fl{transition:none!important}
.bd #clock{--p:1}
/* Noe's birthday: dog stickers fall with the confetti, swaying and tilting instead of spinning */
.fx b.dog i{background:center/contain no-repeat;animation-name:swaydog}
@keyframes swaydog{from{transform:translateX(calc(-1 * var(--x))) rotate(calc(-1 * var(--rd)))}to{transform:translateX(var(--x)) rotate(var(--rd))}}
/* Data fades in when it arrives or changes */
.in{animation:fadein .3s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* Night mode: dim everything and drop the amber accent */
.ss{transition:opacity 1.5s ease}
.cal .hd,.cal .h,.cal .n{transition:color 1.5s ease}
.night .ss{opacity:.38}
.night .fx{display:none}
.night .cal .hoy .hd{color:rgba(255,255,255,.75)}
.night .cal .hoy .h{color:rgba(255,255,255,.45)}
.night .cal .hoy .n{color:rgba(255,255,255,.7)}
#beta{position:absolute;top:2vh;left:2.5vw;z-index:2;font-size:min(1.2vw,1.9vh);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#fff;opacity:.22}
</style>
</head>
<body>
<div class="ss" id="ss">
  <div class="fx" id="fx"></div>
  <div class="mid">
    <div id="clock"></div>
    <div class="fl" id="fl"></div>
    <div id="date"></div>
    <div class="wx" id="wx"></div>
  </div>
  <div id="avisos"></div>
</div>

    if (ev.c) for (const [id, x] of Object.entries(ev.c)) {
      const cur = S[id] || (S[id] = {s: undefined, a: {}});
      if (x['+']) { if ('s' in x['+']) cur.s = x['+'].s; if (x['+'].a) Object.assign(cur.a, x['+'].a); }
      if (x['-'] && x['-'].a) for (const k of x['-'].a) delete cur.a[k];
    }
    if (ev.r) for (const id of ev.r) delete S[id];
  };

  const renderWeather = () => {
    const w = S[WEATHER]; const f = S[FEELS];
    const t = parseFloat(w && w.a.temperature); const fl = parseFloat(f && f.s);
    setHTML($('wx'), isNaN(t) ? '' : `${svg(WX_ICON[w.s] || 'weather-cloudy')}<span class="t">${Math.round(t)}°</span><span class="m">${WX_TEXT[w.s] || w.s || ''}${isNaN(fl) ? '' : ' · sensación ' + Math.round(fl) + '°'}</span>`);
  };
  const renderNight = () => document.body.classList.toggle('night', (S[NIGHT] || {}).s === 'on');

  // ---- Birthdays -------------------------------------------------------------
  let fxKey = '';
  const DOG_SLOTS = 5;
  let dogNext = 0;
  const dogX = (v) => (v < .5 ? 2 + v * 2 * 18 : 80 + (v - .5) * 2 * 18); // 2–20 % or 80–98 % of the width
  // When a dog finishes its fall, swap in the next one at a new side position
  document.addEventListener('animationiteration', (e) => {
    const b = e.target; if (e.animationName !== 'fall' || !b.classList || !b.classList.contains('dog')) return;
    b.style.left = dogX(Math.random()).toFixed(1) + '%';
    b.firstElementChild.style.backgroundImage = `url(${DOGS[dogNext++ % DOGS.length]})`;
  });
  const confetti = (dogs, entrance) => {
    let sd = 7; const r = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
    const C = ['#ffb020', '#ff6b8b', '#7ad3ff', '#b98cff', '#7be3a1']; let o = '';
    for (let i = 0; i < (dogs ? 38 : 44); i++) {
      const x = r() * 100; const w = r() < .55; const z = .55 + r() * .6; const fd = 9 + r() * 9;
      o += `<b style="left:${x.toFixed(1)}%;animation-duration:${fd.toFixed(1)}s;animation-delay:${entrance ? (r() * 10).toFixed(1) : '-' + (r() * fd).toFixed(1)}s"><i style="width:${(w ? z * .45 : z).toFixed(2)}vw;height:${(w ? z * 1.1 : z).toFixed(2)}vw;background:${C[i % 5]};border-radius:${w ? '2px' : '50%'};opacity:${(.55 + r() * .35).toFixed(2)};--r:${Math.round(300 + r() * 420)}deg;--x:${(1 + r() * 2.5).toFixed(1)}vw;animation-duration:${(1.4 + r() * 1.8).toFixed(1)}s;animation-delay:-${(r() * 3).toFixed(1)}s"></i></b>`;
    }
    // Dogs: 5 slots on the side bands (never over the clock), slower than the confetti.
    // Each time a slot leaves the screen it comes back with the next dog, so all of them take turns.
    if (dogs) for (let i = 0; i < DOG_SLOTS; i++) {
      const fd = 20 + r() * 8;
      o += `<b class="dog" style="left:${dogX(r()).toFixed(1)}%;animation-duration:${fd.toFixed(1)}s;animation-delay:${entrance ? (3 + i * 4 + r() * 2).toFixed(1) : '-' + (fd * (i + r() * .6) / DOG_SLOTS).toFixed(1)}s"><i style="width:${(4.2 + r() * 1.6).toFixed(2)}vw;height:${(4.2 + r() * 1.6).toFixed(2)}vw;background-image:url(${DOGS[dogNext++ % DOGS.length]});--rd:${Math.round(8 + r() * 14)}deg;--x:${(.8 + r() * 1.5).toFixed(1)}vw;animation-duration:${(2.5 + r() * 2).toFixed(1)}s;animation-delay:-${(r() * 3).toFixed(1)}s"></i></b>`;
    }
    return o;
  };
  // The entrance only plays when the birthday starts while the screensaver is open (midnight, or a date
  // changed in HA). If it is already a birthday when the page loads, everything is shown straight away.
  let bdKnown = false;
  const renderBirthday = () => {
    if (!BIRTHDAYS.some((id) => S[id])) return; // no data yet (first load without cache)
    const n = new Date();
    const isToday = (id) => { const a = (S[id] || {}).a || {}; return a.month === n.getMonth() + 1 && a.day === n.getDate(); };
    const on = BIRTHDAYS.some(isToday); const dogs = on && isToday(DOG_BIRTHDAY);
    const entrance = bdKnown; bdKnown = true;
    const key = on ? (dogs ? 'dogs' : 'confetti') : '';
    if (key !== fxKey) { fxKey = key; $('fx').innerHTML = on ? confetti(dogs, entrance) : ''; }
    const ss = $('ss');
    if (!on) { ss.classList.remove('bd'); return; }
    if (ss.classList.contains('bd')) return;
    if (entrance) { setTimeout(() => ss.classList.add('bd'), 50); return; }
    ss.classList.add('instant', 'bd');
    requestAnimationFrame(() => requestAnimationFrame(() => ss.classList.remove('instant')));
  };

  // ---- Calendar --------------------------------------------------------------
  let events = [];
  const renderCalendar = () => {
    const now = new Date(); const d0 = new Date(now); d0.setHours(0, 0, 0, 0);
    const d1 = new Date(d0.getTime() + 86400000); const d2 = new Date(d1.getTime() + 86400000);
    const ord = (a, b) => (b.ad - a.ad) || (a.s - b.s);
    const hoy = events.filter((x) => x.s && x.s < d1 && (!x.e || x.e > now)).sort(ord);
    const man = events.filter((x) => x.s && x.s < d2 && (!x.e || x.e > d1) && (x.ad || x.s >= d1)).sort(ord);
    const col = (L, today) => {
      if (!L.length) return '';
      const sh = L.slice(0, L.length > 3 ? 2 : 3); const more = L.length - sh.length;
      return `<div class="col ${today ? 'hoy' : 'man'}"><div class="hd">${svg(today ? 'calendar-today' : 'calendar-arrow-right')}${today ? 'Hoy' : 'Mañana'}</div><div class="ls">${sh.map((x) => `<span class="h">${x.ad ? 'Todo el día' : hm(x.s)}</span><span class="n">${esc(x.m)}</span>`).join('')}</div>${more ? `<div class="mas">y ${more} más</div>` : ''}</div>`;
    };
    const a = col(hoy, true); const b = col(man, false);
    setHTML($('avisos'), !a && !b ? '' : `<div class="cal${a && b ? '' : ' uno'}">${a}${a && b ? '<div class="sep"></div>' : ''}${b}</div>`);
  };

  let ha = null; let calAt = 0; let calDay = ''; let calBusy = false;
  const fetchCalendar = async (force) => {
    const day = new Date().toDateString();
    if (!ha || calBusy || (!force && calDay === day && Date.now() - calAt < CAL_REFRESH_MS)) return;
    calBusy = true;
    try {
      const d0 = new Date(); d0.setHours(0, 0, 0, 0); const d2 = new Date(d0.getTime() + 2 * 86400000);
      const res = await ha.call({type: 'call_service', domain: 'calendar', service: 'get_events', service_data: {start_date_time: d0.toISOString(), end_date_time: d2.toISOString()}, target: {entity_id: CALENDARS}, return_response: true});
      const R = (res && res.response) || {}; const seen = {}; const out = [];
      Object.values(R).forEach((c) => ((c && c.events) || []).forEach((e) => {
        const k = e.summary + '|' + e.start; if (seen[k]) return; seen[k] = 1;
        out.push({m: e.summary || '', s: parseDate(e.start), e: parseDate(e.end), ad: !/T|:/.test(String(e.start))});
      }));
      events = out; calAt = Date.now(); calDay = day; renderCalendar(); saveCache();
    } catch (err) {
      console.warn('[salvapantallas] calendar', err); calAt = Date.now() - CAL_REFRESH_MS + 5 * 60 * 1000; // retry in 5 min
    } finally { calBusy = false; }
  };

  // ---- Home Assistant connection ------------------------------------------
  // Custom page with "Share Home Assistant connection": Kiosk injects kioskSatellite.ha.
  // Website screensaver on the HA origin: reuse the frontend's stored session (hassTokens),
  // refreshing the access token first when it has expired.
  const getAccessToken = async () => {
    let t; try { t = JSON.parse(localStorage.getItem('hassTokens')); } catch (e) { /* ignore */ }
    if (!t || !t.access_token) throw new Error('No Home Assistant session in this browser');
    if (t.expires && t.expires > Date.now() + 30000) return t.access_token;
    const body = new URLSearchParams({grant_type: 'refresh_token', client_id: t.clientId || location.origin + '/', refresh_token: t.refresh_token});
    const r = await fetch((t.hassUrl || location.origin) + '/auth/token', {method: 'POST', body});
    if (!r.ok) throw new Error('Token refresh failed: ' + r.status);
    const n = await r.json();
    return n.access_token;
  };

  const directConnection = async (onClose) => {
    const token = await getAccessToken();
    return new Promise((resolve, reject) => {
      const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/websocket');
      let id = 0; const pending = {}; const subs = {}; let ready = false;
      const send = (msg) => { const mid = ++id; ws.send(JSON.stringify({...msg, id: mid})); return mid; };
      ws.onmessage = (m) => {
        const d = JSON.parse(m.data);
        if (d.type === 'auth_required') ws.send(JSON.stringify({type: 'auth', access_token: token}));
        else if (d.type === 'auth_ok') { ready = true; resolve({
          call: (msg) => new Promise((res, rej) => { pending[send(msg)] = {res, rej}; }),
          subscribe: (msg, cb) => new Promise((res, rej) => { const mid = send(msg); subs[mid] = cb; pending[mid] = {res, rej}; }),
        }); }
        else if (d.type === 'auth_invalid') reject(new Error('auth_invalid'));
        else if (d.type === 'result' && pending[d.id]) { const p = pending[d.id]; delete pending[d.id]; d.success ? p.res(d.result) : p.rej(d.error); }
        else if (d.type === 'event' && subs[d.id]) subs[d.id](d.event);
      };
      ws.onerror = () => { if (!ready) reject(new Error('WebSocket error')); };
      ws.onclose = () => { if (!ready) reject(new Error('WebSocket closed')); else onClose(); };
    });
  };

  // ---- Cache (shows the last known data instantly on the next load) ---------
  const CACHE_KEY = 'salvapantallas-cache';
  const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify({S, events, day: calDay})); } catch (e) { /* ignore */ } };
  const loadCache = () => {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if (!c) return;
      Object.assign(S, c.S || {});
      if (c.day === new Date().toDateString()) events = (c.events || []).map((x) => ({...x, s: x.s && new Date(x.s), e: x.e && new Date(x.e)}));
    } catch (e) { /* ignore */ }
  };

  // ---- Main loop -------------------------------------------------------------
  let lastDay = '';
  const minute = () => {
    const day = new Date().toDateString();
    if (day !== lastDay) { lastDay = day; $('date').textContent = dateText(); renderBirthday(); fetchCalendar(true); renderCalendar(); }
    else fetchCalendar(false);
  };
  const tick = () => { $('clock').innerHTML = clockHtml(); if (new Date().getSeconds() === 0) minute(); };

  $('fl').innerHTML = svg('cake-variant') + '¡Feliz cumpleaños!';
  loadCache(); renderWeather(); renderNight();
  tick(); minute(); setInterval(tick, 1000);

  let retryMs = 1000;
  const start = async () => {
    try {
      const injected = window.kioskSatellite && window.kioskSatellite.ha;
      ha = injected || await directConnection(() => { ha = null; setTimeout(start, 2000); });
      retryMs = 1000;
      await ha.subscribe({type: 'subscribe_entities', entity_ids: [WEATHER, FEELS, NIGHT, ...BIRTHDAYS]}, (ev) => {
        applyEntities(ev && ev.event ? ev.event : ev); renderWeather(); renderBirthday(); renderNight(); saveCache();
      });
      fetchCalendar(true);
    } catch (err) {
      console.warn('[salvapantallas]', err); ha = null;
      setTimeout(start, retryMs); retryMs = Math.min(retryMs * 2, 30000);
    }
  };
  start();
})();
</script>
</body>
</html>
